<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - {{ evento.nome }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function mascaraTelefone(input) {
            let v = input.value.replace(/\D/g, ''); // Remove tudo que não for número
            
            // Trava em no máximo 11 números puros (2 do DDD + 9 números)
            if (v.length > 11) v = v.substring(0, 11);
            
            // Regra do 9 obrigatório: se digitou o DDD, garante que o próximo é o 9
            if (v.length > 2 && v[2] !== '9') {
                v = v.substring(0, 2) + '9' + v.substring(2);
            }
            
            // Constrói a máscara visual progressivamente
            if (v.length <= 2) {
                input.value = v; // Ex: 31
            } else if (v.length <= 7) {
                input.value = v.replace(/(\d{2})(\d+)/, '($1) $2'); // Ex: (31) 99595
            } else {
                input.value = v.replace(/(\d{2})(\d{5})(\d+)/, '($1) $2-$3'); // Ex: (31) 99595-9595
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-md mx-auto p-4">
        <a href="/" class="text-blue-600 font-medium mb-4 inline-block">&larr; Voltar</a>
        
        <div class="bg-white rounded-xl shadow-md p-6">
            <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">Inscrição</h1>
            <p class="text-center text-gray-600 mb-6">{{ evento.nome }} - <span class="text-green-600 font-bold">{{ evento.preco_display }}</span></p>
            
            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome</label>
                    <input type="text" name="nome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Sobrenome</label>
                    <input type="text" name="sobrenome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">WhatsApp (com DDD)</label>
                    <!-- A Mágica acontece aqui: minlength="15" e maxlength="15" impedem o envio se estiver incompleto -->
                    <input type="tel" name="telefone" oninput="mascaraTelefone(this)" 
                           placeholder="(31) 90000-0000" 
                           pattern="\(\d{2}\) 9\d{4}-\d{4}" 
                           minlength="15" 
                           maxlength="15" 
                           required 
                           title="O telefone precisa ter o DDD e os 9 dígitos. Ex: (31) 99595-9595" 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:border-blue-500 focus:ring-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white text-center py-3 rounded-lg font-bold hover:bg-blue-700 transition mt-4">
                    Ir para Pagamento
                </button>
            </form>
        </div>
    </div>
</body>
</html>
